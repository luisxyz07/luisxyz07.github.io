<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body class="home">
  <div class="space-bg" aria-hidden="true"></div>
  <div class="stars-layer" data-stars="home" aria-hidden="true"></div>
  <div class="celestial-orbit orbit-one" aria-hidden="true"></div>
  <div class="celestial-orbit orbit-two" aria-hidden="true"></div>
  <button class="motion-toggle" type="button" data-motion-toggle aria-label="Animationen pausieren" aria-pressed="false"><span class="motion-icon" aria-hidden="true"></span></button>
  <main class="screen">
    <header class="home-header">
      <svg class="celestial-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="14"/><ellipse cx="24" cy="24" rx="23" ry="8" transform="rotate(-35 24 24)"/><path d="M24 4v5m0 30v5M4 24h5m30 0h5"/><circle cx="36" cy="13" r="2" fill="currentColor" stroke="none"/></svg>
      <p class="eyebrow">ein universum für dich</p>
      <h1 class="site-title">Deine <em>Welten</em></h1>
      <p class="site-sub">Wähle eine Welt und die Reise geht los!</p>
    </header>
    <nav class="portals-container" aria-label="Deine Welten entdecken">
      <div class="portals-row">
        <a href="under_quiet_stars/index.html" class="portal portal-flowers">
          <span class="portal-number" aria-hidden="true">01 /</span>
          <span class="orb-wrap" aria-hidden="true"><span class="planet-orbit"></span><span class="orb orb-flowers"></span><span class="planet-spark">✦</span></span>
          <span class="portal-copy"><span class="portal-name">Blumenwelt</span><span class="portal-desc">Blumen unter<br>stillen Sternen</span></span>
          <span class="portal-enter" aria-hidden="true">Entdecken <span>↗</span></span>
        </a>
        <a href="nights_embrace/index.html" class="portal portal-night">
          <span class="portal-number" aria-hidden="true">02 /</span>
          <span class="orb-wrap" aria-hidden="true"><span class="planet-orbit"></span><span class="orb orb-night"></span><span class="planet-spark">✦</span></span>
          <span class="portal-copy"><span class="portal-name">Sternennacht</span><span class="portal-desc">Cassiopeia am<br>nächtlichen Himmel</span></span>
          <span class="portal-enter" aria-hidden="true">Entdecken <span>↗</span></span>
        </a>
      </div>
      <div class="portals-row">
        <a href="northern_lights/index.html" class="portal portal-aurora">
          <span class="orb-wrap" aria-hidden="true"><span class="planet-orbit"></span><span class="orb orb-aurora"></span></span>
          <span class="portal-copy"><span class="new-label">Eine neue Welt</span><span class="portal-name">Nordlicht</span><span class="portal-desc">Wo der Himmel leise tanzt</span></span>
          <span class="aurora-arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </nav>
    <footer class="home-footer"><span class="footer-star" aria-hidden="true">✦</span><p class="footer-note">Made with heart by Luis</p></footer>
