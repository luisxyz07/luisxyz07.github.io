<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Blumenwelt · Deine Welten</title>

    <!-- Safari / iOS Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Welten">

    <!-- Standard favicon -->
    <meta name="theme-color" content="#080b19">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="256x256" href="../images/apple-touch-icon.png">
    <link rel="icon" type="image/x-icon" href="../images/flowers-icon.ico">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../assets/app.css">
    <link rel="stylesheet" href="../assets/worlds.css">
    <script src="../assets/app.js" defer></script>
    <script src="../assets/update.js" defer></script>
    <script src="flowers.js" defer></script>
  </head>
  <body class="flower-world">
    <div class="scene-stars" data-stars="flowers" aria-hidden="true"></div>

    <button class="world-back" id="backBtn" type="button">Zurück</button>
    <button class="motion-toggle" type="button" data-motion-toggle aria-label="Animationen pausieren" aria-pressed="false"><span class="motion-icon" aria-hidden="true"></span></button>
    <main>
      <header class="flower-intro" id="flowerIntro">
        <p class="scene-eyebrow">Blumenwelt</p>
        <h1 class="scene-title">Blumen unter<br><em>stillen Sternen.</em></h1>
        <button class="scene-action" id="startBtn" type="button" aria-controls="flowerScene" aria-expanded="false">Was ist das? <span aria-hidden="true">✧</span></button>
      </header>
      <p class="flower-caption" id="flowerCaption" hidden>Blumen unter stillen Sternen</p>
    <div class="frame" id="flowerScene" role="group" aria-label="Blumenstrauß mit einer kleinen Überraschung" aria-hidden="true" inert>
      <div class="flower">
        <div class="container container-1">
          <div class="stick"></div>
          <div class="leaf-wrap">
            <div class="leaf leaf-1"></div>
            <div class="leaf leaf-2"></div>
            <div class="leaf leaf-3"></div>
            <div class="leaf leaf-4"></div>
            <div class="leaf leaf-5"></div>
            <div class="leaf leaf-6"></div>
            <div class="leaf leaf-7"></div>
            <div class="leaf leaf-8 fall-down-yellow"></div>
          </div>
        </div>
        <div class="container container-2">
          <div class="stick"></div>
          <div class="leaf-wrap">
            <div class="leaf leaf-1"></div>
            <div class="leaf leaf-2"></div>
            <div class="leaf leaf-3"></div>
            <div class="leaf leaf-4"></div>
            <div class="leaf leaf-5"></div>
            <div class="leaf leaf-6"></div>
            <div class="leaf leaf-7"></div>
            <div class="leaf leaf-8 fall-down-pink"></div>
          </div>
        </div>
        <div class="container container-3">
          <div class="stick"></div>
          <div class="leaf-wrap">
            <div class="leaf leaf-1"></div>
            <div class="leaf leaf-2"></div>
            <div class="leaf leaf-3"></div>
            <div class="leaf leaf-4"></div>
            <div class="leaf leaf-5"></div>
            <div class="leaf leaf-6"></div>
            <div class="leaf leaf-7"></div>
            <div class="leaf leaf-8 fall-down-purple"></div>
          </div>
        </div>
        <div class="flower-vase"></div>
      </div>

      <div class="catc">
        <a href="cats.html" id="catBtn" aria-label="Kiwis Geheimversteck entdecken">
            <img class="cat" src="images/cat2.png" alt="Kiwi schaut hinter der Vase hervor" />
        </a>
      </div>
    </div>
    </main>
  </body>
</html>
