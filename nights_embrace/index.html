<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sternennacht · Deine Welten</title>

<!-- iPhone / web-app optimization -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080b19">
<meta name="format-detection" content="telephone=no">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #060010;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: none;
  }

  * {
    box-sizing: border-box;
  }

  .sky {
    position: fixed;
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    top: 0;
    left: 0;
    background: #060010;
    background: linear-gradient(
      to bottom,
      #060010 0%,
      #060010 6%,
      #090016 11%,
      #070016 20%,
      #0a0121 48%,
      #0a0127 55%,
      #0a0129 57%,
      #0c012b 62%,
      #0e0131 68%,
      #0d012f 69%,
      #18023c 78%,
      #19023e 79%,
      #19023e 79%,
      #1c0242 81%,
      #22034b 85%,
      #2e045a 92%,
      #2f045e 96%,
      #340464 98%,
      #370569 100%
    );
    transform: scale(1);
  }

  .mountains {
    position: absolute;
    height: 80px;
    width: 100%;
    bottom: 0px;
    left: 0px;
    z-index: 2;
  }

  .light-base {
    position: absolute;
    bottom: -80px;
    left: 10vw;
    width: 80vw;
    height: 100px;
    border-radius: 50%;
    box-shadow: -0px -10px 30px 10px #ffc1a0, -0px -20px 40px 20px #fe9c7f,
      -0px -30px 60px 30px #be6590, -0px -50px 150px 75px #632b6c;
    background-color: #ffc1a0;
    z-index: 1;
  }

  .mountains-base {
    content: "";
    background: linear-gradient(
      to bottom,
      rgba(55, 5, 105, 0) 0%,
      rgba(9, 0, 22, 1) 100%
    );
    width: 100%;
    height: 100px;
    position: absolute;
    bottom: -10px;
    z-index: 3;
  }

  .mountains-base:after {
    content: "";
    background: linear-gradient(
      to bottom,
      rgba(55, 5, 105, 0) 0%,
      rgba(9, 0, 22, 1) 100%
    );
    width: 100%;
    height: 20px;
    position: absolute;
    bottom: 0px;
    z-index: 3;
  }

  .mountains-base:before {
    content: "";
    background: linear-gradient(
      to bottom,
      rgba(55, 5, 105, 0) 0%,
      rgba(9, 0, 22, 1) 100%
    );
    width: 100%;
    height: 15px;
    position: absolute;
    bottom: 10px;
    z-index: 2;
  }

  .mountains > [class^="mountain"],
  .mountains > [class^="mountain"]:after,
  .mountains > [class^="mountain"]:before,
  .mountains > [class^="land"],
  .mountains > [class^="land"]:after,
  .mountains > [class^="land"]:before {
    background: #110124;
    box-shadow: 0px 0px 50px 5px rgba(255, 255, 255, 0.2);
    position: absolute;
    bottom: 0px;
  }

  .mountain-2 {
    width: 60px;
    height: 60px;
    bottom: -20px !important;
    left: -10px;
    transform: rotate(45deg);
    border-top-left-radius: 10px;
  }

  .mountain-1 {
    width: 100px;
    height: 100px;
    bottom: -40px !important;
    left: 10px;
    transform: rotate(45deg);
    border-top-left-radius: 10px;
  }

  .land-1 {
    width: 30%;
    height: 20px;
    border-top-right-radius: 100%;
  }

  .land-2 {
    width: 60%;
    height: 15px;
    left: 30%;
    border-top-left-radius: 200%;
    border-top-right-radius: 200%;
  }

  .land-3 {
    width: 20%;
    height: 20px;
    left: 80%;
    border-top-left-radius: 100%;
  }

  .stars {
    position: absolute;
    top: 0px;
    left: 0px;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    transition: all 10s linear;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background-color: white;
    opacity: 0.8;
  }

  .blink {
    animation: blink ease-in-out infinite;
  }

  @keyframes blink {
    50% {
      opacity: 0;
    }
  }

  .star-0 { height: 0.5px; width: 0.5px; }
  .star-1 { height: 1px; width: 1px; }
  .star-2 { height: 1.5px; width: 1.5px; }
  .star-3 { height: 2px; width: 2px; }
  .star-4 {
    height: 2.5px;
    width: 2.5px;
    box-shadow: 0px 0px 6px 1px rgba(255,255,255,0.5);
  }
  .star-5 {
    height: 2.5px;
    width: 2.5px;
    box-shadow: 0px 0px 6px 1px rgba(255,255,255,0.7);
  }

  .stars-cross {
    position: absolute;
    top: 10vh;
    left: 0px;
    width: 120vw;
    height: 20vh;
    transform: rotate(20deg);
    transform-origin: top left;
  }

  .stars-cross-aux {
    position: absolute;
    top: 0vh;
    left: 10vw;
    width: 120vw;
    height: 10vh;
    transform: rotate(20deg);
    transform-origin: top left;
  }

  .stars-cross > .blur,
  .stars-cross-aux > .blur {
    position: absolute;
    border-radius: 50%;
    background-color: white;
    opacity: 1;
    filter: blur(15px);
    width: 5px;
    height: 10px;
  }

  /* ---------- Cassiopeia ---------- */

  .cassiopeia {
    position: absolute;
    top: 22%;
    left: 50%;
    transform: translateX(-50%);
    width: min(78vw, 480px);
    height: 30vh;
    z-index: 5;
    pointer-events: none;
  }

  .cassiopeia svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .cass-line {
    fill: none;
    stroke: rgba(255, 255, 255, 0.28);
    stroke-width: 1;
    stroke-linecap: round;
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    animation: drawLine 2.6s ease-out forwards;
    animation-delay: 0.4s;
  }

  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  .cass-star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    transform: translate(-50%, -50%);
    opacity: 0;
    animation: cassAppear 1.2s ease-out forwards, cassTwinkle 3.4s ease-in-out infinite;
  }

  @keyframes cassAppear {
    to { opacity: 1; }
  }

  @keyframes cassTwinkle {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .cass-label {
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    margin-top: 14px;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    letter-spacing: 0.35em;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.55);
    white-space: nowrap;
    opacity: 0;
    animation: cassAppear 1.5s ease-out forwards;
    animation-delay: 2.2s;
    text-transform: uppercase;
  }

  .back-btn {
    position: fixed;
    top: 3.5rem;
    left: 1rem;
    z-index: 10;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 200;
    font-size: 1.1rem;
    padding: 0.5rem 1rem;
    cursor: pointer;
    border-radius: 8px;
    opacity: 1;
    pointer-events: all;
    transition: background 0.3s ease, opacity 0.5s ease;
  }

  .back-btn:hover {
    background: rgba(255, 255, 255, 0.3);
  }
</style>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" sizes="256x256" href="../images/apple-touch-icon.png">
<link rel="icon" type="image/x-icon" href="../images/flowers-icon.ico">
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="../assets/night.css">
<script src="../assets/app.js" defer></script>
<script src="../assets/update.js" defer></script>
<meta name="apple-mobile-web-app-title" content="Welten">
</head>
<body>
<main class="sky">
  <a class="world-back" href="../index.html">Zurück</a><button class="motion-toggle" type="button" data-motion-toggle aria-label="Animationen pausieren" aria-pressed="false"><span class="motion-icon" aria-hidden="true"></span></button><header class="scene-heading night-heading"><p class="scene-eyebrow">Sternennacht</p><h1 class="scene-title">Unter demselben Himmel.</h1></header>
  <div class="mountains">
    <div class="mountain-1"></div>
    <div class="mountain-2"></div>
    <div class="land-1"></div>
    <div class="land-2"></div>
    <div class="land-3"></div>
  </div>
  <div class="mountains-base"></div>
  <div class="light-base"></div>
  <div class="stars" data-stars="night" aria-hidden="true"></div>

  <!-- Cassiopeia, positioned dead-center-upper of the viewport -->
  <div class="cassiopeia" id="cassiopeia" role="img" aria-label="Das Sternbild Cassiopeia, fünf Sterne durch eine W-förmige Linie verbunden">
    <svg viewBox="0 0 100 40" preserveAspectRatio="none">
      <polyline class="cass-line"
        points="8,32 34,8 50,26 74,4 92,30" />
    </svg>
    <!-- Caph -->
    <div class="cass-star" style="width:5px;height:5px;left:8%;top:80%;box-shadow:0 0 8px 2px rgba(255,255,255,0.6);"></div>
    <!-- Schedar -->
    <div class="cass-star" style="width:6px;height:6px;left:34%;top:20%;box-shadow:0 0 10px 3px rgba(255,255,255,0.7);animation-delay:.15s,0s;"></div>
    <!-- Gamma Cas (brightest) -->
    <div class="cass-star" style="width:7px;height:7px;left:50%;top:65%;box-shadow:0 0 14px 4px rgba(255,255,255,0.85);animation-delay:.3s,0s;"></div>
    <!-- Ruchbah -->
    <div class="cass-star" style="width:5.5px;height:5.5px;left:74%;top:10%;box-shadow:0 0 9px 2px rgba(255,255,255,0.65);animation-delay:.45s,0s;"></div>
    <!-- Segin -->
    <div class="cass-star" style="width:4.5px;height:4.5px;left:92%;top:75%;box-shadow:0 0 7px 2px rgba(255,255,255,0.55);animation-delay:.6s,0s;"></div>
    <div class="cass-label">Cassiopeia</div>
  </div>
<svg class="mountain-ridge" viewBox="0 0 1440 350" preserveAspectRatio="none" aria-hidden="true"><path d="M0 250L140 155 230 196 390 70 510 173 620 143 800 230 970 107 1120 180 1260 100 1440 210V350H0Z" fill="#29253e"/><path d="M0 280L200 230 330 261 540 179 660 246 840 205 1040 280 1240 218 1440 267V350H0Z" fill="#191a2d"/><path d="M0 305Q260 265 500 310T1000 298T1440 310V350H0Z" fill="#0c101f"/></svg><p class="scene-caption">Cassiopeia am nächtlichen Himmel</p></main>
</body>
</html>
