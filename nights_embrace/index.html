<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cassiopeia Night Sky</title>

<!-- iPhone / web-app optimization -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060010">
<meta name="format-detection" content="telephone=no">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #060010;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: none;
  }

  * {
    box-sizing: border-box;
  }

  .sky {
    position: fixed;
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    top: 0;
    left: 0;
    background: #060010;
    background: linear-gradient(
      to bottom,
      #060010 0%,
      #060010 6%,
      #090016 11%,
      #070016 20%,
      #0a0121 48%,
      #0a0127 55%,
      #0a0129 57%,
      #0c012b 62%,
      #0e0131 68%,
      #0d012f 69%,
      #18023c 78%,
      #19023e 79%,
      #19023e 79%,
      #1c0242 81%,
      #22034b 85%,
      #2e045a 92%,
      #2f045e 96%,
      #340464 98%,
      #370569 100%
    );
    transform: scale(1);
  }

  .mountains {
    position: absolute;
    height: 80px;
    width: 100%;
    bottom: 0px;
    left: 0px;
    z-index: 2;
  }

  .light-base {
    position: absolute;
    bottom: -80px;
    left: 10vw;
    width: 80vw;
    height: 100px;
    border-radius: 50%;
    box-shadow: -0px -10px 30px 10px #ffc1a0, -0px -20px 40px 20px #fe9c7f,
      -0px -30px 60px 30px #be6590, -0px -50px 150px 75px #632b6c;
    background-color: #ffc1a0;
    z-index: 1;
  }

  .mountains-base {
    content: "";
    background: linear-gradient(
      to bottom,
      rgba(55, 5, 105, 0) 0%,
      rgba(9, 0, 22, 1) 100%
    );
    width: 100%;
    height: 100px;
    position: absolute;
    bottom: -10px;
    z-index: 3;
  }

  .mountains-base:after {
    content: "";
    background: linear-gradient(
      to bottom,
      rgba(55, 5, 105, 0) 0%,
      rgba(9, 0, 22, 1) 100%
    );
    width: 100%;
    height: 20px;
    position: absolute;
    bottom: 0px;
    z-index: 3;
  }

  .mountains-base:before {
    content: "";
    background: linear-gradient(
      to bottom,
      rgba(55, 5, 105, 0) 0%,
      rgba(9, 0, 22, 1) 100%
    );
    width: 100%;
    height: 15px;
    position: absolute;
    bottom: 10px;
    z-index: 2;
  }

  .mountains > [class^="mountain"],
  .mountains > [class^="mountain"]:after,
  .mountains > [class^="mountain"]:before,
  .mountains > [class^="land"],
  .mountains > [class^="land"]:after,
  .mountains > [class^="land"]:before {
    background: #110124;
    box-shadow: 0px 0px 50px 5px rgba(255, 255, 255, 0.2);
    position: absolute;
    bottom: 0px;
  }

  .mountain-2 {
    width: 60px;
    height: 60px;
    bottom: -20px !important;
    left: -10px;
    transform: rotate(45deg);
    border-top-left-radius: 10px;
  }

  .mountain-1 {
    width: 100px;
    height: 100px;
    bottom: -40px !important;
    left: 10px;
    transform: rotate(45deg);
    border-top-left-radius: 10px;
  }

  .land-1 {
    width: 30%;
    height: 20px;
    border-top-right-radius: 100%;
  }

  .land-2 {
    width: 60%;
    height: 15px;
    left: 30%;
    border-top-left-radius: 200%;
    border-top-right-radius: 200%;
  }

  .land-3 {
    width: 20%;
    height: 20px;
    left: 80%;
    border-top-left-radius: 100%;
  }

  .stars {
    position: absolute;
    top: 0px;
    left: 0px;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    transition: all 10s linear;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background-color: white;
    opacity: 0.8;
  }

  .blink {
    animation: blink ease-in-out infinite;
  }

  @keyframes blink {
    50% {
      opacity: 0;
    }
  }

  .star-0 { height: 0.5px; width: 0.5px; }
  .star-1 { height: 1px; width: 1px; }
  .star-2 { height: 1.5px; width: 1.5px; }
  .star-3 { height: 2px; width: 2px; }
  .star-4 {
    height: 2.5px;
    width: 2.5px;
    box-shadow: 0px 0px 6px 1px rgba(255,255,255,0.5);
  }
  .star-5 {
    height: 2.5px;
    width: 2.5px;
    box-shadow: 0px 0px 6px 1px rgba(255,255,255,0.7);
  }

  .stars-cross {
    position: absolute;
    top: 10vh;
    left: 0px;
    width: 120vw;
    height: 20vh;
    transform: rotate(20deg);
    transform-origin: top left;
  }

  .stars-cross-aux {
    position: absolute;
    top: 0vh;
    left: 10vw;
    width: 120vw;
    height: 10vh;
    transform: rotate(20deg);
    transform-origin: top left;
  }

  .stars-cross > .blur,
  .stars-cross-aux > .blur {
    position: absolute;
    border-radius: 50%;
    background-color: white;
    opacity: 1;
    filter: blur(15px);
    width: 5px;
    height: 10px;
  }

  /* ---------- Cassiopeia ---------- */

  .cassiopeia {
    position: absolute;
    top: 22%;
    left: 50%;
    transform: translateX(-50%);
    width: min(78vw, 480px);
    height: 30vh;
    z-index: 5;
    pointer-events: none;
  }

  .cassiopeia svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .cass-line {
    fill: none;
    stroke: rgba(255, 255, 255, 0.28);
    stroke-width: 1;
    stroke-linecap: round;
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    animation: drawLine 2.6s ease-out forwards;
    animation-delay: 0.4s;
  }

  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  .cass-star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    transform: translate(-50%, -50%);
    opacity: 0;
    animation: cassAppear 1.2s ease-out forwards, cassTwinkle 3.4s ease-in-out infinite;
  }

  @keyframes cassAppear {
    to { opacity: 1; }
  }

  @keyframes cassTwinkle {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .cass-label {
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    margin-top: 14px;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    letter-spacing: 0.35em;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.55);
    white-space: nowrap;
    opacity: 0;
    animation: cassAppear 1.5s ease-out forwards;
    animation-delay: 2.2s;
    text-transform: uppercase;
  }

  .back-btn {
    position: fixed;
    top: 3.5rem;
    left: 1rem;
    z-index: 10;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 200;
    font-size: 1.1rem;
    padding: 0.5rem 1rem;
    cursor: pointer;
    border-radius: 8px;
    opacity: 1;
    pointer-events: all;
    transition: background 0.3s ease, opacity 0.5s ease;
  }

  .back-btn:hover {
    background: rgba(255, 255, 255, 0.3);
  }
</style>
</head>
<body>
<div class="sky">
  <button class="back-btn" id="backBtn">Zurück</button>
  <div class="mountains">
    <div class="mountain-1"></div>
    <div class="mountain-2"></div>
    <div class="land-1"></div>
    <div class="land-2"></div>
    <div class="land-3"></div>
  </div>
  <div class="mountains-base"></div>
  <div class="light-base"></div>
  <div class="stars"></div>
  <div class="stars-cross"></div>
  <div class="stars-cross-aux"></div>

  <!-- Cassiopeia, positioned dead-center-upper of the viewport -->
  <div class="cassiopeia" id="cassiopeia">
    <svg viewBox="0 0 100 40" preserveAspectRatio="none">
      <polyline class="cass-line"
        points="8,32 34,8 50,26 74,4 92,30" />
    </svg>
    <!-- Caph -->
    <div class="cass-star" style="width:5px;height:5px;left:8%;top:80%;box-shadow:0 0 8px 2px rgba(255,255,255,0.6);"></div>
    <!-- Schedar -->
    <div class="cass-star" style="width:6px;height:6px;left:34%;top:20%;box-shadow:0 0 10px 3px rgba(255,255,255,0.7);animation-delay:.15s,0s;"></div>
    <!-- Gamma Cas (brightest) -->
    <div class="cass-star" style="width:7px;height:7px;left:50%;top:65%;box-shadow:0 0 14px 4px rgba(255,255,255,0.85);animation-delay:.3s,0s;"></div>
    <!-- Ruchbah -->
    <div class="cass-star" style="width:5.5px;height:5.5px;left:74%;top:10%;box-shadow:0 0 9px 2px rgba(255,255,255,0.65);animation-delay:.45s,0s;"></div>
    <!-- Segin -->
    <div class="cass-star" style="width:4.5px;height:4.5px;left:92%;top:75%;box-shadow:0 0 7px 2px rgba(255,255,255,0.55);animation-delay:.6s,0s;"></div>
    <div class="cass-label">Cassiopeia</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
$(function() {
  var nightsky = ["#280F36", "#632B6C", "#BE6590", "#FFC1A0", "#FE9C7F"];

  var star0 = "<div class='star star-0' style='top:{{top}}vh;left:{{left}}vw;animation-duration:{{duration}}s;'></div>";
  var star1 = "<div class='star star-1 blink' style='top:{{top}}vh;left:{{left}}vw;animation-duration:{{duration}}s;'></div>";
  var star2 = "<div class='star star-2 blink' style='top:{{top}}vh;left:{{left}}vw;animation-duration:{{duration}}s;'></div>";
  var star4 = "<div class='star star-4 blink' style='top:{{top}}vh;left:{{left}}vw;animation-duration:{{duration}}s;'></div>";
  var star5 = "<div class='star star-5' style='top:{{top}}vh;left:{{left}}vw;animation-duration:{{duration}}s;background-color:{{color}}'></div>";
  var star1pt = "<div class='star star-1 blink' style='top:{{top}}%;left:{{left}}%;animation-duration:{{duration}}s;background-color:{{color}};box-shadow:0px 0px 6px 1px {{shadow}}'></div>";
  var star2pt = "<div class='star star-2' style='top:{{top}}%;left:{{left}}%;animation-duration:{{duration}}s;background-color:{{color}};box-shadow:0px 0px 10px 1px {{shadow}};opacity:0.7'></div>";
  var blur = "<div class='blur' style='top:{{top}}%;left:{{left}}%;background-color:{{color}}'></div>";

  // Star field density is trimmed down from the desktop original
  // (roughly 45-55% fewer DOM nodes) to keep animation smooth on
  // iPhone Safari / home-screen web-app contexts.
  var isMobile = /iPhone|iPod|Android/i.test(navigator.userAgent);
  var scale = isMobile ? 0.45 : 1;

  function reps(n) { return Math.round(n * scale); }

  // Skip placing background stars where Cassiopeia sits, so the
  // constellation reads clearly against the field.
  function inCassiopeiaZone(topVh, leftVw) {
    return topVh > 15 && topVh < 55 && leftVw > 22 && leftVw < 78;
  }

  for (i = 0; i < reps(500); i++) {
    var t1 = getRandomInt(0, 40), l1 = getRandomInt(0, 100);
    if (!inCassiopeiaZone(t1, l1)) {
      $(".stars").append(star1.replace("{{top}}", t1).replace("{{left}}", l1).replace("{{duration}}", getRandomInt(2, 5)));
    }
    var t2 = getRandomInt(20, 70), l2 = getRandomInt(0, 100);
    if (!inCassiopeiaZone(t2, l2)) {
      $(".stars").append(star2.replace("{{top}}", t2).replace("{{left}}", l2).replace("{{duration}}", getRandomInt(4, 8)));
    }
  }

  for (i = 0; i < reps(150); i++) {
    $(".stars").append(star0.replace("{{top}}", getRandomInt(0, 50)).replace("{{left}}", getRandomInt(0, 100)).replace("{{duration}}", getRandomInt(1, 2.5)));
    $(".stars").append(star1.replace("{{top}}", getRandomInt(0, 50)).replace("{{left}}", getRandomInt(0, 100)).replace("{{duration}}", getRandomInt(2.5, 4)));
    $(".stars").append(star2.replace("{{top}}", getRandomInt(0, 50)).replace("{{left}}", getRandomInt(0, 100)).replace("{{duration}}", getRandomInt(4, 5)));
  }

  for (i = 0; i < reps(100); i++) {
    $(".stars").append(star0.replace("{{top}}", getRandomInt(40, 75)).replace("{{left}}", getRandomInt(0, 100)).replace("{{duration}}", getRandomInt(1, 3)));
    $(".stars").append(star1.replace("{{top}}", getRandomInt(40, 75)).replace("{{left}}", getRandomInt(0, 100)).replace("{{duration}}", getRandomInt(2, 4)));
  }

  for (i = 0; i < reps(250); i++) {
    $(".stars").append(star0.replace("{{top}}", getRandomInt(0, 100)).replace("{{left}}", getRandomInt(0, 100)).replace("{{duration}}", getRandomInt(1, 2)));
    $(".stars").append(star1.replace("{{top}}", getRandomInt(0, 100)).replace("{{left}}", getRandomInt(0, 100)).replace("{{duration}}", getRandomInt(2, 5)));
    $(".stars").append(star2.replace("{{top}}", getRandomInt(0, 100)).replace("{{left}}", getRandomInt(0, 100)).replace("{{duration}}", getRandomInt(1, 4)));
    $(".stars").append(star4.replace("{{top}}", getRandomInt(0, 70)).replace("{{left}}", getRandomInt(0, 100)).replace("{{duration}}", getRandomInt(5, 7)));
  }

  for (i = 0; i < reps(150); i++) {
    $(".stars").append(star4.replace("{{top}}", getRandomInt(0, 100)).replace("{{left}}", getRandomInt(0, 100)).replace("{{duration}}", getRandomInt(5, 7)));
    $(".stars-cross").append(blur.replace("{{top}}", getRandomInt(0, 100)).replace("{{left}}", getRandomInt(0, 100)).replace("{{color}}", nightsky[Math.ceil(getRandomInt(0, nightsky.length - 1))]));
    $(".stars-cross").append(
      star1pt.replace("{{top}}", getRandomInt(0, 100)).replace("{{left}}", getRandomInt(0, 100)).replace("{{duration}}", getRandomInt(6, 12))
        .replace("{{color}}", nightsky[Math.ceil(getRandomInt(0, nightsky.length - 1))])
        .replace("{{shadow}}", nightsky[Math.ceil(getRandomInt(0, nightsky.length - 1))])
    );
  }

  for (i = 0; i < reps(50); i++) {
    if (i % 2 == 0) {
      $(".stars").append(star5.replace("{{top}}", getRandomInt(0, 50)).replace("{{left}}", getRandomInt(0, 100)).replace("{{duration}}", getRandomInt(5, 7)).replace("{{color}}", nightsky[Math.ceil(getRandomInt(0, nightsky.length - 1))]));
    }
    $(".stars-cross-aux").append(blur.replace("{{top}}", getRandomInt(0, 100)).replace("{{left}}", getRandomInt(0, 100)).replace("{{color}}", nightsky[Math.ceil(getRandomInt(0, nightsky.length - 1))]));
    $(".stars-cross-aux").append(
      star2pt.replace("{{top}}", getRandomInt(0, 100)).replace("{{left}}", getRandomInt(0, 100)).replace("{{duration}}", getRandomInt(4, 10))
        .replace("{{color}}", nightsky[Math.ceil(getRandomInt(0, nightsky.length - 1))])
        .replace("{{shadow}}", nightsky[Math.ceil(getRandomInt(0, nightsky.length - 1))])
    );
  }
});

function getRandomInt(min, max) {
  return Math.random() * (max - min) + min;
}

// Lock viewport height to the actual visible area on iOS Safari
// (handles the address-bar show/hide resize quirk).
function setVH() {
  document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
}
setVH();
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', setVH);

const backBtn = document.getElementById('backBtn');

backBtn.addEventListener('click', () => {
  window.location.href = '../index.html';
});
</script>
</body>
</html>
